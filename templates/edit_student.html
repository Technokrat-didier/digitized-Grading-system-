{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_title %}Edit Student{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Edit {{ student.full_name }}</h2>
    <p class="muted">Update the student's details. Use "Marks" to change subject scores.</p>
    <form method="post" id="student-form" novalidate>
        <div class="form-grid">
            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" value="{{ data.full_name }}" required maxlength="120">
            </div>
            <div class="form-group">
                <label for="admission_number">Admission Number *</label>
                <input type="text" id="admission_number" name="admission_number" value="{{ data.admission_number }}" required maxlength="30">
            </div>
            <div class="form-group">
                <label for="class_name">Class / Form *</label>
                <input type="text" id="class_name" name="class_name" value="{{ data.class_name }}" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="academic_year">Academic Year *</label>
                <input type="text" id="academic_year" name="academic_year" value="{{ data.academic_year }}" required maxlength="20">
            </div>
        </div>
        <div class="form-error" id="student-form-error" hidden></div>
        <div class="form-actions">
            <button type="submit" class="btn">Save Changes</button>
            <a class="btn btn-outline" href="{{ url_for('enter_marks', student_id=student.id) }}">Edit Marks</a>
            <a class="btn btn-outline" href="{{ url_for('students') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
