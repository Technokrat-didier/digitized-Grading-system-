{% extends "base.html" %}
{% block title %}Register Student{% endblock %}
{% block page_title %}Register Student{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>New Student</h2>
    <p class="muted">Enter the student's details. Subject marks are added in the next step.</p>
    <form method="post" id="student-form" novalidate>
        <div class="form-grid">
            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" value="{{ data.full_name }}" required maxlength="120">
            </div>
            <div class="form-group">
                <label for="admission_number">Admission Number *</label>
                <input type="text" id="admission_number" name="admission_number" value="{{ data.admission_number }}" required maxlength="30">
            </div>
            <div class="form-group">
                <label for="class_name">Class / Form *</label>
                <input type="text" id="class_name" name="class_name" value="{{ data.class_name }}" placeholder="e.g. Form 3 Blue" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="academic_year">Academic Year *</label>
                <input type="text" id="academic_year" name="academic_year" value="{{ data.academic_year }}" placeholder="e.g. 2026" required maxlength="20">
            </div>
        </div>
        <div class="form-error" id="student-form-error" hidden></div>
        <div class="form-actions">
            <button type="submit" class="btn">Register Student</button>
            <a class="btn btn-outline" href="{{ url_for('students') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
